name: Feature request
description: Propose a focused improvement backed by a concrete use case
title: "feature: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What preview-versus-production decision is difficult today?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Example or evidence
      description: Provide a public, synthetic, or fully redacted example.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain the smallest change that would solve the problem.
    validations:
      required: true
  - type: checkboxes
    id: principles
    attributes:
      label: Product principles
      options:
        - label: The proposal can remain deterministic and read-only.
          required: true
        - label: The proposal does not require reports to expose response bodies or secret values.
          required: true
