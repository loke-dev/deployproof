name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    steps:
      - name: Verify publishing is enabled
        env:
          NPM_PUBLISH_ENABLED: ${{ vars.NPM_PUBLISH_ENABLED }}
        run: |
          if [[ "$NPM_PUBLISH_ENABLED" != "true" ]]; then
            printf '%s\n' "::error title=Publishing disabled::Set NPM_PUBLISH_ENABLED to true before creating a release tag"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Verify tag matches package version
        run: test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"
      - name: Pack release artifact
        id: pack
        run: |
          npm pack --ignore-scripts --json > "$RUNNER_TEMP/pack.json"
          tarball="$(node -p "require(process.env.RUNNER_TEMP + '/pack.json')[0].filename")"
          integrity="$(node -p "require(process.env.RUNNER_TEMP + '/pack.json')[0].integrity")"
          printf 'tarball=%s\n' "$tarball" >> "$GITHUB_OUTPUT"
          printf 'integrity=%s\n' "$integrity" >> "$GITHUB_OUTPUT"
      - name: Publish to npm
        env:
          RELEASE_TARBALL: ${{ steps.pack.outputs.tarball }}
          RELEASE_INTEGRITY: ${{ steps.pack.outputs.integrity }}
        run: |
          package_spec="$(node -p "const p=require('./package.json'); p.name+'@'+p.version")"
          if npm view "$package_spec" version >/dev/null 2>&1; then
            echo "$package_spec is already published"
          else
            npm publish "$RELEASE_TARBALL" --provenance --access public
          fi
          published_integrity=""
          for attempt in 1 2 3 4 5 6; do
            if published_integrity="$(npm view "$package_spec" dist.integrity 2>/dev/null)"; then
              break
            fi
            if [[ "$attempt" -lt 6 ]]; then
              sleep 5
            fi
          done
          if [[ "$RELEASE_INTEGRITY" != "$published_integrity" ]]; then
            printf '%s\n' "::error title=Integrity verification failed::The npm artifact does not match the release tarball"
            exit 1
          fi
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" "$RELEASE_TARBALL" --verify-tag --generate-notes
