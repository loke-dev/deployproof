name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: npm pack
      - name: Create GitHub release
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" deployproof-*.tgz --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Publish to npm
        run: |
          package_spec="$(node -p "const p=require('./package.json'); p.name+'@'+p.version")"
          if npm view "$package_spec" version >/dev/null 2>&1; then
            echo "$package_spec is already published"
          else
            npm publish --provenance --access public
          fi
