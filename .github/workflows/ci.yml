name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    name: Node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Verify committed CLI bundle
        run: git diff --exit-code -- dist
      - name: Smoke test local Action
        uses: ./
        with:
          preview: https://deployproof.loke.dev
          production: https://deployproof.loke.dev
          strict: true

  npm-artifact:
    name: Node 20 npm artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          package-manager-cache: false
      - name: Pack, install, and run published shape
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          tarball="$RUNNER_TEMP/deployproof-${version}.tgz"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP"
          mkdir "$RUNNER_TEMP/smoke"
          cd "$RUNNER_TEMP/smoke"
          npm init --yes >/dev/null
          npm install --ignore-scripts --no-audit --no-fund "$tarball"
          test "$(node -p "Object.keys(require('./node_modules/deployproof/package.json').dependencies || {}).length")" = "0"
          test "$(./node_modules/.bin/deployproof --version)" = "$version"
