name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    name: Node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          run_install: false
          standalone: ${{ matrix.node == 20 }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Verify committed CLI bundle
        run: git diff --exit-code -- dist
      - name: Smoke test local Action
        uses: ./
        with:
          preview: https://deployproof.loke.dev
          production: https://deployproof.loke.dev
          strict: true
      - name: Reject invalid Action strict input
        id: invalid-strict
        if: matrix.node == 24
        continue-on-error: true
        uses: ./
        with:
          preview: https://deployproof.loke.dev
          production: https://deployproof.loke.dev
          strict: invalid
      - name: Verify invalid Action input failed
        if: always() && matrix.node == 24
        run: test "${{ steps.invalid-strict.outcome }}" = "failure"

  npm-artifact:
    name: Node 20 npm artifact
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
          package-manager-cache: false
      - name: Pack, install, and run published shape
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          tarball="$RUNNER_TEMP/deployproof-${version}.tgz"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP"
          mkdir "$RUNNER_TEMP/smoke"
          cd "$RUNNER_TEMP/smoke"
          npm init --yes >/dev/null
          npm install --ignore-scripts --no-audit --no-fund "$tarball"
          test "$(node -p "Object.keys(require('./node_modules/deployproof/package.json').dependencies || {}).length")" = "0"
          test "$(./node_modules/.bin/deployproof --version)" = "$version"
