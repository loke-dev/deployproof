name: DeployProof
description: Prove a preview deployment behaves like production
author: Loke
branding:
  icon: check-circle
  color: purple
inputs:
  preview:
    description: Preview deployment base URL
    required: true
  production:
    description: Production base URL
    required: true
  config:
    description: Path to a DeployProof config file
    required: false
    default: ""
  routes:
    description: Newline-separated routes to compare in addition to the config file
    required: false
    default: ""
  timeout:
    description: Optional per-request timeout in milliseconds
    required: false
    default: ""
  strict:
    description: Boolean string; true fails when warnings are found
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
      with:
        node-version: 24
        package-manager-cache: false
    - name: Compare preview with production
      shell: bash
      env:
        DEPLOYPROOF_PREVIEW: ${{ inputs.preview }}
        DEPLOYPROOF_PRODUCTION: ${{ inputs.production }}
        DEPLOYPROOF_CONFIG: ${{ inputs.config }}
        DEPLOYPROOF_ROUTES: ${{ inputs.routes }}
        DEPLOYPROOF_TIMEOUT: ${{ inputs.timeout }}
        DEPLOYPROOF_STRICT: ${{ inputs.strict }}
      run: |
        set -euo pipefail
        args=("--format" "github")
        if [[ -n "$DEPLOYPROOF_CONFIG" ]]; then
          args+=("--config" "$DEPLOYPROOF_CONFIG")
        fi
        while IFS= read -r route || [[ -n "$route" ]]; do
          if [[ -n "$route" ]]; then
            args+=("--route" "$route")
          fi
        done <<< "$DEPLOYPROOF_ROUTES"
        if [[ -n "$DEPLOYPROOF_TIMEOUT" ]]; then
          args+=("--timeout" "$DEPLOYPROOF_TIMEOUT")
        fi
        case "$DEPLOYPROOF_STRICT" in
          true) args+=("--strict") ;;
          false) args+=("--no-strict") ;;
          *)
            printf '%s\n' "::error title=Invalid DeployProof input::strict must be true or false"
            exit 2
            ;;
        esac
        node "$GITHUB_ACTION_PATH/dist/cli.js" "${args[@]}"
