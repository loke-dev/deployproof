name: DeployProof
description: Prove a preview deployment behaves like production
author: Loke
branding:
  icon: check-circle
  color: purple
inputs:
  preview:
    description: Preview deployment base URL
    required: true
  production:
    description: Production base URL
    required: true
  config:
    description: Path to a DeployProof config file
    required: false
    default: ""
  strict:
    description: Fail when warnings are found
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 24
        package-manager-cache: false
    - name: Compare preview with production
      shell: bash
      env:
        DEPLOYPROOF_PREVIEW: ${{ inputs.preview }}
        DEPLOYPROOF_PRODUCTION: ${{ inputs.production }}
        DEPLOYPROOF_CONFIG: ${{ inputs.config }}
        DEPLOYPROOF_STRICT: ${{ inputs.strict }}
      run: |
        set -euo pipefail
        args=("--format" "github")
        if [[ -n "$DEPLOYPROOF_CONFIG" ]]; then
          args+=("--config" "$DEPLOYPROOF_CONFIG")
        fi
        if [[ "$DEPLOYPROOF_STRICT" == "true" ]]; then
          args+=("--strict")
        else
          args+=("--no-strict")
        fi
        node "$GITHUB_ACTION_PATH/dist/cli.js" "${args[@]}"
